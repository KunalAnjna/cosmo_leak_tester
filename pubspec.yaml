
    


name: cosmo_calculator
description: Industrial Leak Testing Calculator — Cosmo Calculator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    # Logo shown in AppBar
    - assets/images/cosmo_logo.jpeg
    # Launcher icon source
    - assets/icon/app_icon.png
    # PDF manuals
    - assets/manuals/LS_R700.pdf
    - assets/manuals/LS_R902.pdf
    - assets/manuals/AF_2400.pdf
    - assets/manuals/AF_R220.pdf
    - assets/manuals/LS_1864X.pdf
    - assets/manuals/LS_1866.pdf
    - assets/manuals/LS_R740.pdf
    - assets/manuals/LS_R900.pdf
    
    - assets/manuals/MV_6000B.pdf
    - assets/manuals/LS_1822A.pdf
    - assets/manuals/DP_340B.pdf
    - assets/manuals/DF_2820.pdf
    - assets/manuals/DF__240BA.pdf
    - assets/manuals/DF__231BA.pdf
    


