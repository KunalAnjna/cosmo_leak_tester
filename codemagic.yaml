workflows:
  ios-sideloadly:
    name: iOS Build for Sideloadly (No Developer Account)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter version check
        script: flutter --version

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Generate iOS Flutter files
        script: |
          flutter precache --ios
          cd ios
          flutter pub get
          cd ..

      - name: Set iOS deployment target
        script: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
          fi

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned IPA
        script: |
          flutter build ios --release --no-codesign
          
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          
          # Mac ka ditto command - symlinks sahi rehte hain
          ditto -c -k --sequesterRsrc --keepParent Payload cosmo_leak_tester.ipa
          cp cosmo_leak_tester.ipa build/ios/cosmo_leak_tester.ipa
          
          echo "✅ IPA created!"

    artifacts:
      - build/ios/cosmo_leak_tester.ipa