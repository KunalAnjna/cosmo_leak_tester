workflows:
  ios-sideloadly:
    name: iOS Build for Sideloadly (No Developer Account)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter version check
        script: flutter --version

      - name: Get dependencies
        script: flutter pub get

      - name: Set iOS deployment target
        script: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
          fi

      - name: Flutter iOS generate files
        script: |
          flutter precache --ios

      - name: Install CocoaPods
        script: |
          sudo gem install cocoapods || true
          cd ios
          pod repo update --verbose
          pod install --repo-update --verbose
          cd ..

      - name: Build unsigned IPA
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../cosmo_leak_tester.ipa Payload/
          echo "✅ IPA created successfully!"

    artifacts:
      - build/ios/cosmo_leak_tester.ipa
      - build/ios/iphoneos/Runner.app