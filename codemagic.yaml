workflows:
  ios-sideloadly:
    name: iOS Build for Sideloadly (No Developer Account)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter version check
        script: flutter --version

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Generate iOS Flutter files
        script: |
          flutter precache --ios
          cd ios
          flutter pub get
          cd ..

      - name: Set iOS deployment target
        script: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
          fi

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned IPA
        script: |
          flutter build ios --release --no-codesign
          
          # IPA properly banao
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          
          # Symlinks ke saath zip karo (zaroori hai iOS ke liye)
          zip -r9 --symlinks cosmo_leak_tester.ipa Payload/
          
          # Root build folder mein bhi copy karo
          cp cosmo_leak_tester.ipa ../../../cosmo_leak_tester.ipa
          
          echo "✅ IPA created successfully!"

    artifacts:
      - build/ios/cosmo_leak_tester.ipa
      - build/ios/iphoneos/cosmo_leak_tester.ipa